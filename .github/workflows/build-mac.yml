name: Build VaporStow macOS x64
run-name: Build VaporStow macOS x64

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: Optional release tag (defaults to package version)
                required: false
                type: string
    push:
        tags:
            - '*'

permissions:
    contents: write

jobs:
    build:
        name: VaporStow macOS x64
        runs-on: macos-15-intel

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: |
                  npx tsc -p renderer/tsconfig.json --noEmit
                  npx tsc -p electron/tsconfig.json --noEmit

            - name: Build DMG
              run: npm run build-mac

            - name: Upload macOS artifact
              uses: actions/upload-artifact@v7
              with:
                  name: VaporStow-macos-x64
                  path: |
                      release/VaporStow-macos-x64/*.dmg
                      release/VaporStow-macos-x64/*.dmg.blockmap
                      release/VaporStow-macos-x64/latest*.yml
                  if-no-files-found: error

            - name: Create release ZIP
              shell: bash
              run: |
                  set -euo pipefail
                  cd release/VaporStow-macos-x64
                  shopt -s nullglob
                  files=( *.dmg *.dmg.blockmap latest*.yml )
                  if (( ${#files[@]} == 0 )); then
                      echo 'No macOS release files found.' >&2
                      exit 1
                  fi
                  zip -9 ../VaporStow-macos-x64.zip "${files[@]}"

            - name: Resolve release tag
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ "${{ github.event_name }}" == "push" ]]; then
                      tag="${{ github.ref_name }}"
                  elif [[ -n "${{ inputs.release_tag }}" ]]; then
                      tag="${{ inputs.release_tag }}"
                  else
                      tag="$(node -p 'require("./package.json").version')"
                  fi
                  echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

            - name: Upload ZIP to GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
                  fi
                  gh release upload "$RELEASE_TAG" release/VaporStow-macos-x64.zip --clobber
